day1:
  horizon: 1
  feature_set: E0
  random_seed: 42
  missing_value_policy: xgboost_native
  prediction_probability_threshold: 0.5

regression:
  estimator: XGBRegressor
  objective: reg:squarederror
  eval_metric: rmse
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1
  subsample: 1.0
  colsample_bytree: 1.0
  gamma: 0.0
  reg_alpha: 0.0
  reg_lambda: 1.0
  max_delta_step: 0.0
  tree_method: hist
  n_jobs: -1

classification:
  estimator: XGBClassifier
  objective: binary:logistic
  eval_metric: logloss
  n_estimators: 300
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 1
  subsample: 1.0
  colsample_bytree: 1.0
  gamma: 0.0
  reg_alpha: 0.0
  reg_lambda: 1.0
  max_delta_step: 0.0
  tree_method: hist
  n_jobs: -1

ranking:
  rank_column: predicted_return_1d
  higher_is_better: true
  top_k: [5, 10, 20]

artifacts:
  validation_predictions: validation_predictions.parquet
  regression_model: baseline_regression_model.json
  classification_model: baseline_classification_model.json
  regression_metrics: regression_metrics.json
  classification_metrics: classification_metrics.json
  ranking_metrics: ranking_metrics.json
  feature_importance: feature_importance.parquet
  run_metadata: phase2_run_metadata.json
  report: phase2_baseline_report.txt



